<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <!-- Etiquetas anti-caché para forzar siempre la última versión -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- Optimización móvil -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Carga Forestal</title>
    
    <!-- Enlace al CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Enlace al archivo de identidad de la App -->
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="sticky-header">
        <h1>Control Forestal</h1>
    </header>

    <main>
        <!-- 1. Sección superior: Largo y Cantidad -->
        <section class="card inputs-section">
            <h2>1. Dimensiones (Fijas)</h2>
            <div class="input-row">
                <div class="input-group">
                    <label for="length-input">Largo (m)</label>
                    <input type="text" id="length-input" inputmode="decimal" placeholder="Ej: 4.5">
                </div>
                <div class="input-group">
                    <label for="qty-input">Cantidad</label>
                    <!-- Pre-rellenado con 1 -->
                    <input type="number" id="qty-input" inputmode="numeric" value="1" min="1" step="1">
                </div>
            </div>
        </section>

        <!-- 2. Sección central: Botones de diámetro (Ejecutores) -->
        <section class="card">
            <h2>2. Presionar Diámetro para Agregar</h2>
            <div id="diameter-grid" class="btn-grid"></div>
        </section>

        <!-- 3. Sección de Cálculo Total -->
        <section class="card total-section">
            <h2>Acumulado Total</h2>
            <div class="total-display">
                <strong id="total-volume">0</strong> <span>m³</span>
            </div>
            <!-- Contador de trozos -->
            <div class="total-qty-display">
                <span>Cantidad de trozos: </span>
                <strong id="total-qty">0</strong>
            </div>
        </section>

        <!-- 4. Sección de Controles y Registros -->
        <section class="card list-section">
            <!-- NUEVO BOTÓN DE EXPORTAR -->
            <button id="btn-export" class="btn-excel" style="margin-bottom: 10px;">Exportar Resumen Excel</button>
            
            <div class="action-buttons">
                <button id="btn-delete-last" class="btn-warning">Eliminar Último</button>
                <button id="btn-undo" class="btn-secondary" disabled>Deshacer</button>
                <button id="btn-clear-all" class="btn-danger">Eliminar Todo</button>
            </div>
            
            <div class="list-header">
                <h2>Registros</h2>
            </div>
            <div id="records-list">
                <!-- Los registros se inyectarán aquí dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Firma profesional en el pie de página -->
    <footer>
        <p>Aplicación creada por Cristian Cárdenas Arellano</p>
    </footer>

    <!-- ÚNICO llamado al script, ubicado al final del body para no retrasar la carga visual -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
    
    
    <!-- Script para instalar el motor Offline (Service Worker) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registro => {
                        console.log('Service Worker registrado con éxito:', registro.scope);
                    })
                    .catch(error => {
                        console.log('Error al registrar el Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
